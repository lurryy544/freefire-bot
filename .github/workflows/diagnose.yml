name: diagnose

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Проверка бота
        env:
          BOT_TOKEN: ${{ secrets.FF_BOT_TOKEN }}
        run: node src/selftest.js